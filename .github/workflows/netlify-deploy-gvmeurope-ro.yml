name: Deploy gvmeurope.ro to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'sites/gvmeurope.ro/**'
      - '.github/workflows/netlify-deploy-gvmeurope-ro.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: sites/gvmeurope.ro/public
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy gvmeurope.ro (${{ github.sha }})"
          enable-pull-request-comment: false
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_GVMEUROPE_RO_SITE_ID }}
        timeout-minutes: 5
