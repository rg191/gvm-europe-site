name: Deploy gvmeurope.ro to Netlify

# IMPORTANT:
# Do NOT deploy gvmeurope.ro to the glogiai Netlify site
# (genuine-banoffee-bf6eea / secrets.NETLIFY_SITE_ID).
# Use a dedicated site (e.g. gvm-europe-staging) and set
# secrets.NETLIFY_GVMEUROPE_RO_SITE_ID to THAT site's Site ID.
#
# Auto-deploy on push is disabled until the secret points to the
# dedicated site. Run manually via Actions → workflow_dispatch.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — refuse glogiai / genuine-banoffee site id
        env:
          GVM_SITE_ID: ${{ secrets.NETLIFY_GVMEUROPE_RO_SITE_ID }}
          GLOGIAI_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GVM_SITE_ID}" ]; then
            echo "::error::NETLIFY_GVMEUROPE_RO_SITE_ID is empty. Create a dedicated Netlify site for gvmeurope.ro and set the secret."
            exit 1
          fi
          if [ -n "${GLOGIAI_SITE_ID}" ] && [ "${GVM_SITE_ID}" = "${GLOGIAI_SITE_ID}" ]; then
            echo "::error::NETLIFY_GVMEUROPE_RO_SITE_ID matches NETLIFY_SITE_ID (glogiai / genuine-banoffee). Refusing to deploy — set a dedicated Site ID."
            exit 1
          fi
          echo "Site ID guard OK (dedicated secret differs from glogiai)."

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: sites/gvmeurope.ro/public
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy gvmeurope.ro (${{ github.sha }})"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_GVMEUROPE_RO_SITE_ID }}
        timeout-minutes: 5
