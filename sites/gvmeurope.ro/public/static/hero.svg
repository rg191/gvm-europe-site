<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9eb6c8"/>
      <stop offset="42%" stop-color="#c5d3dc"/>
      <stop offset="100%" stop-color="#e7ecef"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4452"/>
      <stop offset="100%" stop-color="#1e2530"/>
    </linearGradient>
    <linearGradient id="truck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f6e64"/>
      <stop offset="100%" stop-color="#0a4f48"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243041"/>
      <stop offset="100%" stop-color="#151b24"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- distant hills -->
  <path d="M0 520 C220 460 380 500 560 470 C760 430 920 500 1120 455 C1280 420 1420 470 1600 440 L1600 560 L0 560 Z" fill="#7f95a6" opacity=".55"/>
  <path d="M0 560 C260 520 480 580 720 540 C980 490 1180 560 1600 520 L1600 620 L0 620 Z" fill="#6a7f90" opacity=".45"/>
  <!-- road plane -->
  <path d="M0 620 L1600 560 L1600 900 L0 900 Z" fill="url(#road)"/>
  <path d="M120 720 L1520 640" stroke="#d4a017" stroke-width="10" stroke-dasharray="48 36" opacity=".85"/>
  <path d="M0 780 L1600 700" stroke="#2c3542" stroke-width="2" opacity=".5"/>
  <!-- trailer -->
  <g transform="translate(420 470)">
    <rect x="180" y="40" width="620" height="170" rx="10" fill="url(#truck)"/>
    <rect x="200" y="60" width="180" height="90" rx="4" fill="#d9e3e7" opacity=".22"/>
    <rect x="410" y="60" width="180" height="90" rx="4" fill="#d9e3e7" opacity=".18"/>
    <rect x="620" y="60" width="150" height="90" rx="4" fill="#d9e3e7" opacity=".14"/>
    <text x="490" y="155" text-anchor="middle" fill="#e8f4f2" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" letter-spacing="4">GVM</text>
    <!-- cab -->
    <path d="M40 70 h150 l50 40 v100 h-200 z" fill="url(#cab)"/>
    <path d="M70 90 h100 l30 28 H70 z" fill="#8ec8d8" opacity=".55"/>
    <circle cx="95" cy="220" r="38" fill="#11161d"/>
    <circle cx="95" cy="220" r="22" fill="#5b6573"/>
    <circle cx="280" cy="220" r="38" fill="#11161d"/>
    <circle cx="280" cy="220" r="22" fill="#5b6573"/>
    <circle cx="700" cy="220" r="38" fill="#11161d"/>
    <circle cx="700" cy="220" r="22" fill="#5b6573"/>
    <circle cx="780" cy="220" r="38" fill="#11161d"/>
    <circle cx="780" cy="220" r="22" fill="#5b6573"/>
  </g>
  <!-- soft vignette -->
  <rect width="1600" height="900" fill="url(#sky)" opacity="0"/>
  <rect width="1600" height="900" fill="#0b1218" opacity=".18"/>
</svg>
